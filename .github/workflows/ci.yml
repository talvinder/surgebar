name: CI

on:
  push:
    branches: [main, native-swift]
  pull_request:

jobs:
  build:
    name: Build app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test native integration
        run: swift test --jobs 1

      - name: Build and assemble the app bundle
        run: ./scripts/build-app.sh release

      - name: Verify the bundle is a real, signed app
        run: |
          APP=.build/Surgebar.app
          test -x "$APP/Contents/MacOS/Surgebar"
          test -f "$APP/Contents/Resources/surgebar.icns"
          # A menu bar app must be an agent (LSUIElement) or its status item
          # never appears — assert it rather than trusting the plist by eye.
          plutil -extract LSUIElement raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist"
          codesign --verify --strict "$APP"
          echo "Bundle OK"
